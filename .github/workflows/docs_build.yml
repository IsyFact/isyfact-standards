name: Documentation Build

on:
  pull_request:
    types: [ opened, synchronize, reopened ]
    branches-ignore:
      - main
      - 'support/**'
    #  Doku-Build läuft nur bei Änderungen an der Doku
    paths:
      - 'isyfact-standards-doc/**'
      - '.github/workflows/docs_build.yml'
  push:
    tags:
      - '^\\d+\\.\\d+\\.\\d+$'

jobs:
  DocsBuild:
    permissions:
      contents: read
      pull-requests: write
    uses: IsyFact/isy-github-actions-templates/.github/workflows/docs_build_template.yml@v3.0.0
    secrets:
      ANTORA_TRIGGER_TOKEN: ${{ secrets.ANTORA_TRIGGER_TOKEN }}
